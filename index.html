<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Twenty5 Realty - Client Inquiry Form</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-color: #0F172A;
            --accent-color: #D97706;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-color: #1E293B;
            --border-color: #E2E8F0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            padding-bottom: 30px;
        }

        .header-card {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: #FFFFFF;
            border-radius: var(--radius);
            padding: 20px 16px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

        .logo-wrapper { margin-bottom: 10px; }
        .logo-img { max-height: 65px; max-width: 180px; object-fit: contain; }
        .brand-title { font-size: 22px; font-weight: 700; color: #F8FAFC; }
        .brand-tagline { font-size: 13px; color: var(--accent-color); font-weight: 600; margin-top: 2px; text-transform: uppercase; }

        .contact-pills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;
            font-size: 11px;
        }

        .pill { background: rgba(255, 255, 255, 0.1); padding: 4px 10px; border-radius: 20px; color: #CBD5E1; }

        .form-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
        }

        .form-group { margin-bottom: 16px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }

        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        label .required { color: #EF4444; }

        input[type="text"], input[type="tel"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-color);
            background-color: #F8FAFC;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
            background-color: #FFFFFF;
        }

        textarea { resize: vertical; min-height: 70px; }

        .submit-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header-card">
        <div class="logo-wrapper">
            <img src="logo.png" alt="Twenty5 Realty Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div class="brand-title">TWENTY5 REALTY</div>
        <div class="brand-tagline">Real Estate & Property Inquiry</div>
        <div class="contact-pills">
            <span class="pill">📞 012 800 885 / 081 82 92 94</span>
            <span class="pill">🌐 25realtykh.com</span>
        </div>
    </div>

    <div class="form-card">
        <form id="inquiryForm">
            <div class="section-title">👤 Contact Information</div>
            
            <div class="form-group">
                <label for="fullName">Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" placeholder="012 xxx xxx" required>
                </div>
                <div class="form-group">
                    <label for="preferredContact">Preferred Contact</label>
                    <select id="preferredContact">
                        <option value="Telegram">Telegram</option>
                        <option value="Phone Call">Phone Call</option>
                        <option value="WhatsApp">WhatsApp</option>
                    </select>
                </div>
            </div>

            <div class="section-title" style="margin-top: 10px;">🏠 Property Details</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="propertyType">Property Type <span class="required">*</span></label>
                    <select id="propertyType" required>
                        <option value="">Select Type</option>
                        <option value="Condo / Apartment">Condo / Apartment</option>
                        <option value="Borey Villa / House">Borey Villa / House</option>
                        <option value="Shophouse / Link House">Shophouse / Link House</option>
                        <option value="Land / Plot">Land / Plot</option>
                        <option value="Commercial Space / Office">Commercial / Office</option>
                        <option value="Warehouse / Factory">Warehouse / Factory</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="purpose">Purpose <span class="required">*</span></label>
                    <select id="purpose" required>
                        <option value="Buy">Buy</option>
                        <option value="Rent">Rent</option>
                        <option value="Investment">Investment</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="budget">Budget (USD)</label>
                    <input type="text" id="budget" placeholder="e.g. $100,000 or $500/mo">
                </div>
                <div class="form-group">
                    <label for="location">Preferred Location</label>
                    <input type="text" id="location" placeholder="e.g. BKK1, Chroy Changvar">
                </div>
            </div>

            <div class="section-title" style="margin-top: 10px;">📐 Property Specs</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="bedrooms">Bedrooms</label>
                    <select id="bedrooms">
                        <option value="Any">Any</option>
                        <option value="Studio">Studio</option>
                        <option value="1 Bedroom">1 Bedroom</option>
                        <option value="2 Bedrooms">2 Bedrooms</option>
                        <option value="3 Bedrooms">3 Bedrooms</option>
                        <option value="4+ Bedrooms">4+ Bedrooms</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bathrooms">Bathrooms</label>
                    <select id="bathrooms">
                        <option value="Any">Any</option>
                        <option value="1 Bathroom">1 Bathroom</option>
                        <option value="2 Bathrooms">2 Bathrooms</option>
                        <option value="3 Bathrooms">3 Bathrooms</option>
                        <option value="4+ Bathrooms">4+ Bathrooms</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="parking">Parking Space</label>
                    <select id="parking">
                        <option value="Any">Any</option>
                        <option value="1 Car">1 Car</option>
                        <option value="2 Cars">2 Cars</option>
                        <option value="3+ Cars">3+ Cars</option>
                        <option value="Not Required">Not Required</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="direction">Facing Direction</label>
                    <select id="direction">
                        <option value="Any">Any</option>
                        <option value="North">North (ជើង)</option>
                        <option value="South">South (ត្បូង)</option>
                        <option value="East">East (កើត)</option>
                        <option value="West">West (លិច)</option>
                        <option value="North-East">North-East (ឦសាន)</option>
                        <option value="North-West">North-West (ពាយ័ព្យ)</option>
                        <option value="South-East">South-East (អាគ្នេយ៍)</option>
                        <option value="South-West">South-West (និរតី)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Additional Requirements / Notes</label>
                <textarea id="notes" placeholder="Write any specific preferences or questions here..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Inquiry</button>
        </form>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        document.getElementById('inquiryForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = {
                fullName: document.getElementById('fullName').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                preferredContact: document.getElementById('preferredContact').value,
                propertyType: document.getElementById('propertyType').value,
                purpose: document.getElementById('purpose').value,
                budget: document.getElementById('budget').value.trim() || 'N/A',
                location: document.getElementById('location').value.trim() || 'Any Location',
                bedrooms: document.getElementById('bedrooms').value,
                bathrooms: document.getElementById('bathrooms').value,
                parking: document.getElementById('parking').value,
                direction: document.getElementById('direction').value,
                notes: document.getElementById('notes').value.trim() || 'None',
                submittedAt: new Date().toLocaleString('en-US', { timeZone: 'Asia/Phnom_Penh' })
            };

            if (tg) {
                tg.sendData(JSON.stringify(formData));
            } else {
                alert('Submission successful! (Preview mode outside Telegram)');
                console.log('Form Data:', formData);
            }
        });
    </script>
</body>
</html>
